name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pietra
          POSTGRES_PASSWORD: pietra
          POSTGRES_DB: pietra_unica_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pietra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pietra:pietra@localhost:5432/pietra_unica_crm_test
      TEST_DATABASE_URL: postgresql://pietra:pietra@localhost:5432/pietra_unica_crm_test
      SESSION_SECRET: ci-test-secret-not-for-production
      SEED_ADMIN_PASSWORD: ci-seed-passord-123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Kjør migreringer
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Enhetstester (Vitest)
        run: npm run test

      - name: Installer nettleser for Playwright
        run: npx playwright install --with-deps chromium

      - name: Bygg
        run: npm run build

      - name: Ende-til-ende-tester (Playwright)
        run: npm run test:e2e

      - name: Last opp testrapport ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
