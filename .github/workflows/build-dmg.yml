name: Bygg DMG (M9)

# Kjøres manuelt (workflow_dispatch), ikke på hver push - dette er et tungt
# bygg (~20-30 min på en macOS-runner) ment for å produsere en usignert DMG
# (DR-16) å teste, ikke en del av den vanlige CI-sjekken (se ci.yml).
#
# electron-builder kan IKKE lage en macOS-DMG fra Linux (dmg-builder sin
# dmg-license-avhengighet er markert "os": ["darwin"], se electron/README.md)
# - denne workflowen kjører derfor på en ekte macOS-runner (macos-14, som er
# Apple Silicon/arm64 - samme arkitektur appen leveres for, DR-10).
on:
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Kun for selve Next.js-bygget under (DATABASE_URL må peke på noe
      # tilkoblbart for at `prisma migrate deploy`/`next build` skal gå
      # gjennom) - IKKE de binærene som pakkes inn i selve DMG-en, se steget
      # lenger ned. macOS-runnere har ikke Docker, så et service-postgres som
      # i ci.yml er ikke mulig her.
      - name: Start en midlertidig lokal PostgreSQL (kun for byggesteget)
        run: |
          set -euo pipefail
          brew install postgresql@16
          brew services start postgresql@16
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          for i in $(seq 1 30); do
            "$PG_BIN/pg_isready" -h 127.0.0.1 -p 5432 && break
            sleep 1
          done
          "$PG_BIN/createuser" -s pietra
          "$PG_BIN/psql" -d postgres -c "ALTER USER pietra WITH PASSWORD 'pietra';"
          "$PG_BIN/createdb" -O pietra pietra_unica_crm

      - name: Installer avhengigheter (rot)
        run: npm ci

      - name: Typecheck og lint
        run: |
          npm run typecheck
          npm run lint

      - name: Kjør migreringer
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://pietra:pietra@127.0.0.1:5432/pietra_unica_crm

      - name: Bygg Next.js standalone, worker og installer-tasks
        run: npm run build:desktop
        env:
          DATABASE_URL: postgresql://pietra:pietra@127.0.0.1:5432/pietra_unica_crm
          SESSION_SECRET: ci-dmg-build-not-for-production
          SEED_ADMIN_PASSWORD: ci-dmg-build-not-for-production

      # DR-10: relokerbare PostgreSQL-binærer (arm64) som skal FØLGE MED i
      # selve appen - se electron/resources/postgres/README.md for hvorfor
      # det må være EDB sin binærdistribusjon og ikke Homebrew (Homebrew sine
      # binærer er lenket mot en fast /opt/homebrew-sti og fungerer derfor
      # ikke flyttet inn i en annen brukers datamappe på en Mac uten
      # Homebrew). Nøyaktig filnavn/versjon hos EDB kan endre seg over tid -
      # prøver derfor en liste med kandidater.
      - name: Hent PostgreSQL 16 arm64-binærer til selve appen (EDB)
        run: |
          set -euo pipefail
          CANDIDATES=(16.10-1 16.9-1 16.9-2 16.8-1 16.8-2 16.7-1 16.6-1 16.6-2 16.5-1 16.5-2 16.4-1 16.4-2 16.3-1)
          mkdir -p /tmp/postgres-extract
          FOUND=""
          for v in "${CANDIDATES[@]}"; do
            url="https://get.enterprisedb.com/postgresql/postgresql-${v}-osx-binaries.zip"
            echo "Prøver $url"
            if curl -fSL --retry 2 --max-time 120 -o /tmp/postgres-binaries.zip "$url"; then
              FOUND="$v"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Fant ingen EDB PostgreSQL 16 arm64-binærdistribusjon blant kandidatene. Se electron/resources/postgres/README.md for alternative kilder, og oppdater CANDIDATES-listen i denne workflowen." >&2
            exit 1
          fi
          echo "Brukte versjon $FOUND"
          unzip -q /tmp/postgres-binaries.zip -d /tmp/postgres-extract
          mkdir -p electron/resources/postgres/bin
          cp /tmp/postgres-extract/pgsql/bin/postgres electron/resources/postgres/bin/
          cp /tmp/postgres-extract/pgsql/bin/initdb electron/resources/postgres/bin/
          cp /tmp/postgres-extract/pgsql/bin/createdb electron/resources/postgres/bin/
          cp /tmp/postgres-extract/pgsql/bin/pg_dump electron/resources/postgres/bin/
          cp /tmp/postgres-extract/pgsql/bin/pg_restore electron/resources/postgres/bin/
          chmod +x electron/resources/postgres/bin/*
          ls -la electron/resources/postgres/bin/

      - name: Installer avhengigheter (electron)
        working-directory: electron
        run: npm ci

      - name: Bygg DMG
        working-directory: electron
        run: npm run dist:mac

      - name: Last opp DMG som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: pietra-unica-crm-dmg
          path: electron/release/*.dmg
          retention-days: 14
          if-no-files-found: error
